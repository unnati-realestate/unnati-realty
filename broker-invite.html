<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realynk — Broker Invitation</title><style>body{margin:0;background:#f5f7fb;color:#17324d;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:20px;padding:24px;box-shadow:0 12px 35px rgba(11,55,104,.08)}.logo{width:92px}.badge{display:inline-block;background:#fff3c4;color:#7d5b00;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#0b3768;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.muted{color:#6b7a8c;line-height:1.5}.status{margin-top:14px;padding:12px;border-radius:11px;display:none}.field{margin-top:12px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd9e5;border-radius:10px;font-size:16px}</style></head><body><div class="wrap"><div class="card"><img class="logo" src="./logo.png" alt="Realynk"><div id="details"><span class="badge">REALYNK BROKER INVITATION</span><h1 style="color:#0b3768">You have been invited to join Realynk</h1><p class="muted">Aapko Realynk Broker Network ka invitation pehle share kiya gaya tha. Neeche Accept & Join karke apni profile submit karein.</p></div><div id="status" class="status"></div><button id="accept" class="primary" style="margin-top:16px">✓ Accept & Join Realynk</button><div id="profile" style="display:none"><div class="field"><input id="name" placeholder="Full Name"></div><div class="field"><input id="phone" placeholder="Mobile Number"></div><div class="field"><input id="company" placeholder="Company / Agency"></div><div class="field"><input id="city" placeholder="City"></div><div class="field"><input id="areas" placeholder="Areas Served"></div><div class="field"><input id="exp" placeholder="Experience"></div><button id="finish" class="primary" style="margin-top:16px">Submit for Verification</button></div><p class="muted" style="margin-bottom:0;margin-top:18px">Your profile will not show as Verified until Realynk completes verification.</p></div></div><script type="module">import{getApps,initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,updateDoc,setDoc,addDoc,collection,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x),show=(t,b,c)=>{const s=$('status');s.textContent=t;s.style.display='block';s.style.background=b;s.style.color=c};let inv=null,user=null,legacy=!id||id==='LEGACY';async function load(){if(legacy){inv={id:'LEGACY',name:'',phone:'',company:'',city:'',areas:'',experience:''};return}try{const snap=await getDoc(doc(db,'brokerInvitations',id));if(!snap.exists()){legacy=true;inv={id:'LEGACY',name:'',phone:'',company:'',city:'',areas:'',experience:''};return}inv={id:snap.id,...snap.data()};$('details').innerHTML='<span class="badge">INVITED BROKER</span><h2 style="color:#0b3768">'+String(inv.name||'Broker')+'</h2><div>'+String(inv.company||'')+'</div><div>'+String(inv.city||'')+'</div><p class="muted">You have been invited to join the Realynk Broker Network.</p>';if(inv.status==='accepted'||inv.status==='pending_verification'){show('Invitation already accepted. Verification is pending.','#fff7df','#9a6700');$('accept').style.display='none'}}catch(e){legacy=true;inv={id:'LEGACY',name:'',phone:'',company:'',city:'',areas:'',experience:''}}}load().catch(console.error);$('accept').onclick=async()=>{try{const r=await signInWithPopup(auth,new GoogleAuthProvider());user=r.user;show('Signed in. Please confirm your broker details below.','#e9f8ef','#18864b');$('accept').style.display='none';$('profile').style.display='block';$('name').value=inv?.name||user.displayName||'';$('phone').value=inv?.phone||'';$('company').value=inv?.company||'';$('city').value=inv?.city||'';$('areas').value=inv?.areas||'';$('exp').value=inv?.experience||''}catch(e){show('Login cancelled or failed. Please try again.','#fff1f0','#b42318')}};$('finish').onclick=async()=>{if(!user||!inv)return;const name=$('name').value.trim(),phone=$('phone').value.trim(),company=$('company').value.trim(),city=$('city').value.trim(),areas=$('areas').value.trim(),exp=$('exp').value.trim();if(!name||!phone){show('Name and mobile number are required.','#fff1f0','#b42318');return}const data={uid:user.uid,fullName:name,phone,companyName:company,city,areas,experience:exp,email:user.email||'',status:'pending',approved:false,verified:false,invitationId:legacy?'LEGACY-GENERIC':inv.id,submittedAt:serverTimestamp(),createdAt:serverTimestamp()};$('finish').disabled=true;try{if(!legacy){await updateDoc(doc(db,'brokerInvitations',inv.id),{status:'pending_verification',acceptedByUid:user.uid,acceptedEmail:user.email||'',acceptedAt:serverTimestamp(),updatedAt:serverTimestamp()});try{await setDoc(doc(db,'brokers',user.uid),data,{merge:true})}catch(e){await setDoc(doc(db,'brokerApplications',user.uid),data,{merge:true})}}else{try{await setDoc(doc(db,'brokers',user.uid),data,{merge:true})}catch(e){await setDoc(doc(db,'brokerApplications',user.uid),data,{merge:true})}}$('profile').style.display='none';show('Application submitted successfully. Your profile is now Pending Verification. Realynk admin will review it.','#e9f8ef','#18864b')}catch(e){console.error(e);show('Could not submit verification. Please try again. If this continues, check your Google login and internet connection.','#fff1f0','#b42318')}finally{$('finish').disabled=false}};</script></body></html>
