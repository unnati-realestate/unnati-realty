<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3768">
<meta name="description" content="Realynk trusted property and broker network">
<title>Realynk – Trusted Property Network</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--navy:#0b3768;--blue:#155a9c;--gold:#f4b400;--bg:#f5f7fb;--text:#17324d;--muted:#6b7a8c;--line:#dfe6ee;--green:#168b4b;--red:#b42318}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:0 0 84px;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{width:100%;max-width:760px;margin:auto;min-height:100vh;background:var(--bg)}
.top{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:20px}.logo{width:50px;height:50px;flex:none}.lang{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 11px;font-weight:700;color:var(--navy);outline:none}
.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;border-radius:0 0 34px 34px;padding:28px 20px 30px}.heroLogo{display:flex;justify-content:center;margin-bottom:14px}.heroLogo .logo{width:78px;height:78px;filter:brightness(0) invert(1)}.eyebrow{font-weight:800;letter-spacing:1.5px;font-size:11px;opacity:.85}.hero h1{font-size:clamp(38px,11vw,50px);line-height:1.02;margin:14px 0 20px}.hero h1 span{color:var(--gold)}.search{display:flex;align-items:center;background:#fff;border-radius:18px;padding:0 14px;color:var(--navy)}.search input{border:0;outline:0;width:100%;padding:17px 8px;font-size:16px;min-width:0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 16px}.quick button,.panel{background:#fff;border:1px solid var(--line);border-radius:18px}.quick button{min-height:112px;color:var(--navy);font-size:27px;font-weight:800;box-shadow:0 2px 8px #00000008}.quick b{display:block;font-size:18px;margin-top:8px}.page{padding:18px}.page h2{margin:4px 0 16px;font-size:27px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 13px;font-size:21px;color:var(--navy)}.panel{padding:16px;margin:12px 0}.muted,.notice{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button,.primary,.whatsapp,.danger{border:0;border-radius:11px;padding:11px 13px;font-weight:700}.primary{background:var(--navy);color:#fff}.whatsapp{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.full{width:100%}.property h3{margin:0 0 6px;font-size:19px}.price{font-weight:800;color:var(--navy);font-size:18px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #cfd9e5;border-radius:11px;font-size:16px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 5px;text-align:center}.stat b{display:block;font-size:23px;color:var(--navy);margin-bottom:3px}.stat span{font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:80px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;color:#7b8795;font-size:22px;padding:7px 2px}.bottom button.active{color:var(--navy);font-weight:800}.bottom small{display:block;font-size:11px;margin-top:3px}.empty{text-align:center;padding:28px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#172b42;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:50;max-width:90%;text-align:center}.mediaBox{border:1px dashed #b7c6d6;border-radius:14px;padding:14px;background:#f8fbff}.mediaBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.uploadBtn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border:1px solid #cfd9e5;border-radius:12px;background:#fff;color:var(--navy);font-weight:800}.mediaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mediaItem{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;aspect-ratio:1}.mediaItem img,.mediaItem video{width:100%;height:100%;object-fit:cover}.removeMedia{position:absolute;right:4px;top:4px;border:0;background:#fff;color:var(--red);width:28px;height:28px;border-radius:50%;font-weight:900;padding:0}.videoPreview{margin-top:10px;border-radius:12px;overflow:hidden;background:#111;display:none}.videoPreview video{width:100%;max-height:260px;display:block}.mediaNote{font-size:12px;color:var(--muted);margin:8px 0 0}.counter{font-size:12px;font-weight:700;color:var(--navy);margin-top:8px}.listingMedia{display:flex;gap:7px;margin-top:10px;overflow:auto}.listingMedia img{width:82px;height:62px;object-fit:cover;border-radius:8px}.videoBadge{padding:8px 10px;background:#eef5fb;border-radius:8px;font-size:12px;font-weight:700;color:var(--navy)}
@media(max-width:420px){.top{height:64px}.logo{width:44px;height:44px}.brand{font-size:18px}.hero{padding:24px 16px 26px}.quick{padding:14px 12px;gap:9px}.quick button{min-height:100px}.quick b{font-size:16px}.page{padding:15px}.page h2{font-size:25px}.actions button{flex:1;min-width:105px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 100 100" aria-label="Realynk"><path fill="#0b3768" d="M20 78V29l31-20v22L38 41v37z"/><path fill="#f4b400" d="M51 9l29 19v50H62V39L51 32z"/><path fill="#0b3768" d="M35 55h29v8H35zm0 13h29v8H35z"/></svg><span>Realynk</span></div><select class="lang" id="language"><option value="en">EN</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option></select></header>
<section id="home" class="screen active"><div class="hero"><div class="heroLogo"><svg class="logo" viewBox="0 0 100 100"><path fill="#0b3768" d="M20 78V29l31-20v22L38 41v37z"/><path fill="#f4b400" d="M51 9l29 19v50H62V39L51 32z"/><path fill="#0b3768" d="M35 55h29v8H35zm0 13h29v8H35z"/></svg></div><div class="eyebrow">REALYNK • TRUSTED PROPERTY NETWORK</div><h1>Find property.<br><span>Build trust.</span></h1><div class="search">⌕<input id="homeSearch" placeholder="Search area, society or property"></div></div><div class="quick"><button data-filter="Buy">🏠<b>Buy</b></button><button data-filter="Rent">🔑<b>Rent</b></button><button data-filter="Commercial">🏢<b>Commercial</b></button><button id="postQuick">＋<b>Post Property</b></button></div><div class="page"><h2>Featured Properties</h2><div id="homeProperties"></div></div></section>
<section id="brokers" class="screen"><div class="page"><button class="back" data-back="home">←</button><h2>Brokers</h2><div id="brokerList"></div></div></section>
<section id="post" class="screen"><div class="page"><button class="back" data-back="home">←</button><h2>Post Property</h2><div class="panel">
<div class="field"><label>Property Title</label><input id="pTitle" placeholder="e.g. 2 BHK Near Metro"></div>
<div class="field"><label>Area</label><input id="pArea" placeholder="Mira Road East"></div>
<div class="field"><label>Type</label><select id="pType"><option value="Buy">Buy</option><option value="Rent">Rent</option><option value="Commercial">Commercial</option></select></div>
<div class="field"><label>Price</label><input id="pPrice" placeholder="₹25,000 / month"></div>
<div class="field"><label>Description</label><textarea id="pDesc" placeholder="Property details"></textarea></div>
<div class="field"><label>Contact / WhatsApp</label><input id="pPhone" value="9658364364"></div>
<div class="field"><label>Property Photos</label><div class="mediaBox"><div class="mediaBtns"><label class="uploadBtn">📷 Add Photos<input id="photoInput" type="file" accept="image/*" multiple hidden></label><label class="uploadBtn">🎥 Add Video<input id="videoInput" type="file" accept="video/*" capture hidden></label></div><div class="counter" id="photoCounter">0 / 10 photos selected</div><div class="mediaGrid" id="photoPreview"></div><div class="videoPreview" id="videoPreview"><video id="videoPlayer" controls playsinline></video></div><p class="mediaNote">Photos: maximum 10. Video: maximum 60 seconds.</p></div></div>
<button class="primary full" id="submitBtn">Submit Property</button>
</div></div></section>
<section id="dashboard" class="screen"><div class="page"><button class="back" data-back="home">←</button><h2>Agent Dashboard</h2><div class="stats"><div class="stat"><b id="myCount">0</b><span>My Listings</span></div><div class="stat"><b>0</b><span>New Leads</span></div><div class="stat"><b>0</b><span>Favorites</span></div></div><div class="panel"><button class="primary full" id="addProperty">＋ Add Property</button></div><div id="myProperties"></div></div></section>
<section id="login" class="screen"><div class="page"><button class="back" data-back="home">←</button><h2>Account</h2><div class="panel"><h3>Broker / Agent Login</h3><div class="field"><label>Mobile Number</label><input value="9658364364"></div><div class="field"><label>Name</label><input placeholder="Your name"></div><button class="primary full" id="loginBtn">Continue</button></div></div></section>
<nav class="bottom"><button data-nav="home" class="active">⌂<small>Home</small></button><button data-nav="brokers">♙<small>Brokers</small></button><button data-nav="post">＋<small>Post</small></button><button data-nav="dashboard">◉<small>Dashboard</small></button><button data-nav="login">☰<small>Account</small></button></nav>
</div><div id="toast" class="toast"></div>
<script>
const defaultProperties=[{id:1,title:'2 BHK Near Metro Station',area:'Kashigaon, Mira Road East',price:'₹25,000 / month',type:'Rent',desc:'Middle floor apartment near metro station.',phone:'9658364364'},{id:2,title:'1 BHK Family Home',area:'Mira Road East',price:'₹72 Lakh',type:'Buy',desc:'Family home in a convenient location.',phone:'9658364364'},{id:3,title:'Furnished Office Space',area:'Mira Road',price:'₹30,000 / month',type:'Commercial',desc:'Ground-floor furnished office.',phone:'9658364364'}];
let properties=JSON.parse(localStorage.getItem('realynkProperties')||'null')||defaultProperties;
let selectedPhotos=[];let selectedVideo=null;let videoUrl=null;
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2600)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));window.scrollTo(0,0);if(id==='home')renderHome();if(id==='dashboard')renderDashboard();if(id==='brokers')renderBrokers()}
function card(p){const media=p.photos&&p.photos.length?'<div class="listingMedia">'+p.photos.slice(0,3).map(x=>'<img src="'+x+'">').join('')+(p.videoName?'<span class="videoBadge">🎥 Video</span>':'')+'</div>':'';return '<div class="panel property"><h3>'+esc(p.title||'Property')+'</h3><div class="muted">📍 '+esc(p.area||'')+'</div><div class="price">'+esc(p.price||'')+'</div><div class="muted">'+esc(p.type||'')+' • '+esc(p.desc||'')+'</div>'+media+'<div class="actions"><button class="whatsapp" onclick="openWhatsApp(\''+esc(p.phone||'9658364364')+'\')">WhatsApp</button></div></div>'}
function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function renderHome(){const q=($('homeSearch')?.value||'').toLowerCase();const list=properties.filter(p=>!q||[p.title,p.area,p.type,p.desc].join(' ').toLowerCase().includes(q));$('homeProperties').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No properties found.</div>'}
function renderDashboard(){const mine=properties.filter(p=>p.mine);$('myCount').textContent=mine.length;$('myProperties').innerHTML=mine.length?mine.map(card).join(''):'<div class="empty">Your posted properties will appear here.</div>'}
function renderBrokers(){$('brokerList').innerHTML='<div class="panel"><b>NAVED</b><div class="muted">Independent Broker • 9819197059</div></div><div class="panel"><b>Unnati Realty</b><div class="muted">Real Estate Broker • 9658364364</div></div><div class="panel"><b>Realynk Partner</b><div class="muted">Channel Partner • 9107364364</div></div>'}
function openWhatsApp(phone){window.open('https://wa.me/91'+String(phone).replace(/\D/g,''),'_blank')}
function resetMedia(){selectedPhotos=[];selectedVideo=null;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;$('photoInput').value='';$('videoInput').value='';$('photoPreview').innerHTML='';$('videoPreview').style.display='none';$('videoPlayer').removeAttribute('src');$('photoCounter').textContent='0 / 10 photos selected'}
$('photoInput').addEventListener('change',e=>{const files=[...e.target.files];if(selectedPhotos.length+files.length>10){toast('Maximum 10 photos allowed');e.target.value='';return}files.forEach(file=>{if(!file.type.startsWith('image/'))return;selectedPhotos.push(file);});renderPhotoPreview();e.target.value=''});
function renderPhotoPreview(){$('photoCounter').textContent=selectedPhotos.length+' / 10 photos selected';$('photoPreview').innerHTML='';selectedPhotos.forEach((file,i)=>{const url=URL.createObjectURL(file);const d=document.createElement('div');d.className='mediaItem';d.innerHTML='<img src="'+url+'"><button class="removeMedia" type="button">×</button>';d.querySelector('button').onclick=()=>{URL.revokeObjectURL(url);selectedPhotos.splice(i,1);renderPhotoPreview()};$('photoPreview').appendChild(d)})}
$('videoInput').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(!file.type.startsWith('video/')){toast('Please select a video');return}const url=URL.createObjectURL(file);const v=$('videoPlayer');v.src=url;v.onloadedmetadata=()=>{if(v.duration>60){URL.revokeObjectURL(url);v.removeAttribute('src');$('videoPreview').style.display='none';selectedVideo=null;videoUrl=null;toast('Video must be 60 seconds or less');return}if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=url;selectedVideo=file;$('videoPreview').style.display='block';toast('Video added successfully')};v.onerror=()=>{URL.revokeObjectURL(url);selectedVideo=null;toast('Video could not be loaded')}});
$('submitBtn').onclick=()=>{const title=$('pTitle').value.trim();if(!title){toast('Please enter Property Title');$('pTitle').focus();return}if(selectedPhotos.length>10){toast('Maximum 10 photos allowed');return}if(!selectedVideo&&videoUrl){toast('Please reselect the video');return}const photoPromises=selectedPhotos.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)}));Promise.all(photoPromises).then(photos=>{const p={id:Date.now(),title,area:$('pArea').value.trim(),price:$('pPrice').value.trim(),type:$('pType').value,desc:$('pDesc').value.trim(),phone:$('pPhone').value.trim(),mine:true,photos,videoName:selectedVideo?selectedVideo.name:''};properties.unshift(p);try{localStorage.setItem('realynkProperties',JSON.stringify(properties))}catch(e){toast('Listing saved, but media is too large for browser storage');}toast('Property posted successfully');$('pTitle').value='';$('pArea').value='';$('pPrice').value='';$('pDesc').value='';resetMedia();show('dashboard')})};
$('homeSearch').addEventListener('input',renderHome);$('postQuick').onclick=()=>show('post');$('addProperty').onclick=()=>show('post');$('loginBtn').onclick=()=>toast('Broker profile ready');
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{show('home');$('homeSearch').value=b.dataset.filter;renderHome()});
$('language').addEventListener('change',e=>{const l=e.target.value;if(l==='hi')toast('हिन्दी चयनित');else if(l==='mr')toast('मराठी निवडले');else if(l==='gu')toast('ગુજરાતી પસંદ કર્યું');else toast('English selected')});
renderHome();renderDashboard();
</script>
</body>
</html>
