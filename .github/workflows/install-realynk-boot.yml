name: Install Realynk Boot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Install Realynk Boot Patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boot script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='REALYNK_BOOT_V1'
          if marker in s:
              raise SystemExit(0)
          patch='<!-- REALYNK_BOOT_V1 --><script type="module" src="./realynk-boot.js?v=1"></script>'
          s=s.replace('</body>', patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit boot patch
        run: |
          git config user.name 'Realynk Bot'
          git config user.email 'realynk-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install Realynk Boot Patch'
          git push
