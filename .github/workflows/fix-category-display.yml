name: Realynk Category Display Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Realynk Category Display Fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix category rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('realynk-final-ui.js')
          s = p.read_text(encoding='utf-8')
          old = "onSnapshot(collection(db,'brokers'),snap=>{brokers={};snap.forEach(d=>brokers[d.id]=d.data());render(activeFilter);});\n  onSnapshot(collection(db,'properties'),snap=>{properties=[];snap.forEach(d=>properties.push({...d.data(),id:d.id}));render(activeFilter);});"
          new = "onSnapshot(collection(db,'brokers'),snap=>{brokers={};snap.forEach(d=>brokers[d.id]=d.data());});\n  onSnapshot(collection(db,'properties'),snap=>{properties=[];snap.forEach(d=>properties.push({...d.data(),id:d.id}));});"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('category-display.js')
          s = p.read_text(encoding='utf-8')
          old = "activeFilter=\"\";\n      document.querySelectorAll(\".quick button\").forEach(b=>b.classList.remove(\"active\")); render(\"\");"
          new = "activeFilter=\"\";\n      const searchInput=$(\"search\"); if(searchInput) searchInput.value=\"\";\n      document.querySelectorAll(\".quick button\").forEach(b=>b.classList.remove(\"active\")); render(\"\");"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'Realynk Bot'
          git config user.email 'realynk-bot@users.noreply.github.com'
          git add realynk-final-ui.js category-display.js
          git diff --cached --quiet && exit 0
          git commit -m 'Realynk Category Display Fix'
          git push
