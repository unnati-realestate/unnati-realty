name: Fix Realynk button script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix JavaScript syntax error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "$('type').onchange=updateListingFields};"
          new = "$('type').onchange=updateListingFields;"
          if old not in s:
              raise SystemExit('Expected broken line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Realynk navigation buttons"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/fix-realynk-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary button fix workflow"
            git push
          fi
