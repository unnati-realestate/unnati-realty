name: Add broker edit option

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Edit Profile button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="editAccount"' not in s:
              needle = '</div></div><div class="field"><label data-i18n="fullName">'
              button = '''</div></div><button id="editAccount" class="back full" type="button" data-i18n="editAccount" onclick="document.getElementById('agentName').focus();window.scrollTo(0,document.getElementById('agentName').getBoundingClientRect().top+window.scrollY-110)">✎ Edit Profile</button><div class="field"><label data-i18n="fullName">'''
              if needle not in s:
                  raise SystemExit('Account form marker not found')
              s = s.replace(needle, button, 1)

              s = s.replace("saveAccount:'Create / Update Broker Account',home:", "saveAccount:'Create / Update Broker Account',editAccount:'Edit Profile',home:", 1)
              s = s.replace("saveAccount:'ब्रोकर अकाउंट बनाएं / अपडेट करें',home:", "saveAccount:'ब्रोकर अकाउंट बनाएं / अपडेट करें',editAccount:'प्रोफाइल एडिट करें',home:", 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Add broker profile edit option"
          git push

      - name: Remove temporary patch workflow
        if: success()
        run: |
          git rm .github/workflows/add-broker-edit-option.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary edit patch workflow" || true
          git push || true
