name: Enable Heavy Deposit on Home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-heavy-deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Heavy Deposit script to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="./heavy-deposit.js?v=20"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Heavy Deposit script already enabled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Heavy Deposit property option to home'
          git push
